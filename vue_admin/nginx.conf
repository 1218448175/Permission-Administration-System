server {
    listen 80;
    server_name localhost;

    # 指向构建产物目录
    root /usr/share/nginx/html;
    index index.html;

    # 开启 Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. 媒体文件转发 (保留完整路径转发给后端)
    location ^~ /api/media/ {
        proxy_pass http://backend:8000; # 👈 末尾不加斜杠，保留 /api/media/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. 普通 API 接口转发 (保留完整路径转发给后端)
    location /api/ {
        proxy_pass http://backend:8000; # 👈 关键修改：去掉末尾的斜杠！
        # 这样浏览器请求 /api/user/captcha，后端收到的也是 /api/user/captcha

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. 处理 Vue Router History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 4. 静态资源缓存策略
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}